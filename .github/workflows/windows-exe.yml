name: Build dshot
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (e.g. v0.8.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/dshot/dshot.csproj
          dotnet build src/dshot/dshot.csproj -c Release --no-restore
      - name: Publish x64 portable application
        shell: pwsh
        run: |
          dotnet publish src/dshot/dshot.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o release
          if (-not (Test-Path release/dshot.exe)) { throw 'dshot.exe not found after publish' }
      - name: Upload executable and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: dshot-Windows-x64
          path: release/**
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa \
            libegl1 libxkbcommon0 libfontconfig1 fonts-dejavu-core shellcheck
          pip install --quiet PySide6-Essentials jeepney pyflakes
      - name: Lint
        run: |
          python -m pyflakes linux/dshot linux/tests
          shellcheck linux/install.sh linux/uninstall.sh
      - name: Unit tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s linux/tests -v
      - name: Package
        run: |
          mkdir -p dist/dshot-linux
          cp -r linux/dshot linux/install.sh linux/uninstall.sh dist/dshot-linux/
          find dist -name '__pycache__' -prune -exec rm -rf {} +
          tar -C dist -czf dist/dshot-linux.tar.gz dshot-linux
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: dshot-Linux
          path: dist/dshot-linux.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [windows-build, linux-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          **Windows 10/11 x64:** download `dshot.exe` (portable, ~26 MB). Needs the Microsoft Windows Desktop Runtime 8 or newer (x64). The exe is unsigned, so SmartScreen may warn: choose *More info > Run anyway*.

          **Linux (CachyOS/Arch, Linux Mint/Ubuntu):** download `dshot-linux.tar.gz`, then:

          ```sh
          tar xzf dshot-linux.tar.gz && cd dshot-linux && ./install.sh
          ```

          Capture with Print Screen (after the installer binds it) or a left click on the tray icon. OCR supports English and Spanish.
          EOF
          gh release create "$TAG" artifacts/dshot-Windows-x64/dshot.exe artifacts/dshot-Linux/dshot-linux.tar.gz \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "dshot $TAG" --notes-file notes.md
